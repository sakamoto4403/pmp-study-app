<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="PMP学習">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#b45ad3">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css">
    <title>PMP学習</title>
  </head>
  <body>
    <main class="app-shell">
      <section id="top-view" class="view" aria-labelledby="top-title"></section>
      <section id="practice-view" class="view" hidden aria-label="演習画面"></section>
      <section id="summary-view" class="view" hidden aria-label="演習終了サマリー画面"></section>
      <section id="review-view" class="view" hidden aria-label="復習モード"></section>
      <section id="textbook-view" class="view" hidden aria-label="教科書モード"></section>
      <section id="history-view" class="view" hidden aria-labelledby="history-title"></section>
      <section id="data-view" class="view" hidden aria-labelledby="data-title"></section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
